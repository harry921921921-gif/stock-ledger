<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>全部異動 · 台股資產帳本</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<div class="app">
	<aside th:replace="~{fragments/layout :: sidebar('assets')}"></aside>
	<main class="content">
		<p class="breadcrumb"><a th:href="@{/assets}">總資產</a> / 全部異動</p>
		<div class="page-header">
			<h1>全部異動</h1>
			<a class="btn btn-primary" th:href="@{/assets/movements/new}">記一筆現金異動</a>
		</div>

		<p class="alert alert-info" th:if="${message}" th:text="${message}">已修改</p>

		<!-- 備註搜尋（spec 4.6-9）：有搜尋字時列出所有月份的結果，不顯示月份切換 -->
		<form class="search-form" method="get" th:action="@{/assets/movements}" role="search">
			<input type="search" name="q" maxlength="50" placeholder="搜尋備註" aria-label="搜尋備註"
					th:value="${search != null} ? ${search.query()} : ''">
			<button type="submit" class="btn btn-secondary">搜尋</button>
			<a th:if="${search != null}" th:href="@{/assets/movements}">清除搜尋</a>
		</form>

		<th:block th:if="${search != null}">
			<p class="alert alert-error" th:if="${search.error()}" th:text="${search.error()}">搜尋字最多 50 個字</p>
			<p th:unless="${search.error()}">搜尋「<strong th:text="${search.query()}">保險</strong>」的結果（所有月份）</p>
			<p class="muted" th:if="${search.error() == null and #lists.isEmpty(rows)}">沒有符合的異動。</p>
		</th:block>

		<!-- 從固定收支頁或資金來源頁的「看紀錄」來：只列這個項目或借款產生的異動（含作廢的） -->
		<th:block th:if="${byItem != null}">
			<p><strong th:text="|「${byItem.itemName()}」的紀錄|">「孝親費」的紀錄</strong>（所有月份）·
				<a th:href="@{${byItem.backUrl()}}" th:text="${byItem.backLabel()}">回固定收支</a> · <a th:href="@{/assets/movements}">看全部異動</a></p>
			<p class="muted" th:if="${#lists.isEmpty(rows)}">還沒有任何紀錄。</p>
		</th:block>

		<th:block th:if="${search == null and byItem == null}">
			<nav class="month-nav" aria-label="切換月份">
				<a th:href="@{/assets/movements(month=${prevMonth})}" th:text="|← ${prevMonth}|">← 2026-09</a>
				<strong th:text="${month}">2026-10</strong>
				<a th:href="@{/assets/movements(month=${nextMonth})}" th:text="|${nextMonth} →|">2026-11 →</a>
			</nav>
			<p class="muted" th:if="${#lists.isEmpty(rows)}">這個月沒有任何異動。</p>
		</th:block>
		<table class="table" th:unless="${#lists.isEmpty(rows)}">
			<thead><tr><th>日期</th><th>帳戶</th><th>內容</th><th class="num">金額</th><th>操作</th></tr></thead>
			<tbody>
				<tr th:each="m : ${rows}" th:classappend="${m.voided()} ? 'voided' : ''">
					<td th:text="${m.date()}">2026-10-07</td>
					<td th:text="${m.accountLabel()}">銀行活存</td>
					<td>
						<span th:text="${m.description()}">存入 · 薪資入帳</span>
						<!-- 作廢也會寫修改紀錄，所以「已作廢」優先，不再顯示「曾修改」 -->
						<span class="badge" th:if="${m.voided()}">已作廢</span>
						<span class="badge" th:if="${m.revised() and !m.voided()}">曾修改</span>
					</td>
					<td class="num" th:replace="~{fragments/movement-amount :: amount(${m})}">+62,000</td>
					<td>
						<th:block th:unless="${m.voided()}">
							<a th:href="@{/assets/movements/{id}/edit(id=${m.id()})}">修改</a>
							<!-- 股票交易自動記的那筆：要到股票頁作廢交易，這裡不給作廢 -->
							<form class="inline-form" method="post" th:action="@{/assets/movements/{id}/void(id=${m.id()})}"
									th:unless="${m.fromTrade()}"
									data-confirm="確定要作廢這筆嗎？作廢後不再計入金額，但會留下紀錄。">
								<input type="text" name="reason" maxlength="200" placeholder="作廢原因（可不填）"
										th:attr="aria-label=|作廢 ${m.date()} 這筆的原因|">
								<button type="submit" class="btn btn-secondary" data-busy-text="作廢中…">作廢</button>
							</form>
						</th:block>
					</td>
				</tr>
			</tbody>
		</table>
	</main>
</div>
</body>
</html>
