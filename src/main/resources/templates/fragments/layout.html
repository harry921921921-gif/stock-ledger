<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!--
	左側選單（spec 第 3 節的六頁順序）。用法：<aside th:replace="~{fragments/layout :: sidebar('settings')}"></aside>
	六頁都可以點。
-->
<aside class="sidebar" th:fragment="sidebar(active)">
	<div class="brand">台股資產帳本</div>
	<nav>
		<a class="nav-item" th:classappend="${active == 'overview'} ? 'active'" th:href="@{/}">總覽</a>
		<a class="nav-item" th:classappend="${active == 'assets'} ? 'active'" th:href="@{/assets}">總資產</a>
		<a class="nav-item" th:classappend="${active == 'stocks'} ? 'active'" th:href="@{/stocks}">股票</a>
		<a class="nav-item" th:classappend="${active == 'funding'} ? 'active'" th:href="@{/funding}">資金來源</a>
		<a class="nav-item" th:classappend="${active == 'recurring'} ? 'active'" th:href="@{/recurring}">固定收支</a>
		<a class="nav-item" th:classappend="${active == 'settings'} ? 'active'" th:href="@{/settings}">設定</a>
	</nav>
	<div class="sidebar-footer">
		<div class="user">
			<span sec:authentication="principal.displayName">使用者</span>
			<small class="muted" sec:authentication="name">帳號</small>
		</div>
		<form th:action="@{/logout}" method="post">
			<button type="submit" class="btn btn-link">登出</button>
		</form>
	</div>
</aside>
</body>
</html>
