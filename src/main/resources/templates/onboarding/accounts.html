<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>帳戶 · 第一次使用 · 台股資產帳本</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<script th:src="@{/js/app.js}" defer></script>
	<script th:src="@{/js/onboarding.js}" defer></script>
</head>
<body>
<!--
	第一次使用引導 1 帳戶（設計文件 2026-10-25-onboarding 3、3.2、4；樣稿 onboarding.html）。
	整頁只有一個表單 step-form；所有按鈕（修改、儲存、上一步、下一步、先離開、確認區塊的按鈕）都用 formaction 送出它，
	所以不管按哪個，打到一半的字都會跟著送到伺服器（存成草稿或拿去預覽）。
	editingId：正在修改的已儲存帳戶（null 是填新的一筆）。confirm：要不要顯示確認區塊。
	表單欄位不加 required：沒填的欄位由伺服器列在「還有欄位沒填好」裡，不用瀏覽器自己的提示。
	locked：確認區塊顯示時把資料欄位鎖住（fieldset disabled），確認過的內容就是畫面上看到的；這時欄位不會送出，
	所有按鈕改用預覽時依代號收起來的那份（隱藏欄位 editing 放在 fieldset 外面，照常送出）。
-->
<div class="app">
	<aside th:replace="~{fragments/layout :: sidebar('')}"></aside>
	<main class="content">
		<div class="wizard">
			<ol th:replace="~{onboarding/layout :: stepper(${stepNumber})}"></ol>
			<p th:replace="~{onboarding/layout :: back(${goUrl}, 'welcome')}"></p>
			<h1 tabindex="-1" th:autofocus="${!confirm}">你的錢放在哪些帳戶？</h1>
			<p class="muted">銀行帳戶、證券交割戶各建一個。借款要撥進帳戶，買股票要從交割戶扣錢，所以先建帳戶。</p>
			<p class="alert alert-info" th:if="${notice != null}" th:text="${notice}">確認畫面已過期，請再按一次儲存</p>

			<div class="added" th:if="${!#lists.isEmpty(saved)}">
				<strong>已儲存的帳戶</strong>
				<ul>
					<li th:each="row : ${saved}" th:classappend="${row.id == editingId} ? 'editing'">
						<span th:text="${row.label}">玉山交割戶（證券交割戶）</span>
						<span th:if="${row.id == editingId}" class="muted">（修改中）</span>
						<button th:unless="${row.id == editingId}" type="submit" form="step-form" class="btn btn-link"
							th:formaction="@{/welcome/accounts/{id}/edit(id=${row.id})}" formnovalidate>修改</button>
					</li>
				</ul>
			</div>

			<form id="step-form" class="form-card" method="post" th:action="@{${previewUrl}}" th:object="${form}">
				<p class="edit-note" th:if="${editingId != null}">正在修改已儲存的資料；改好按「儲存修改」。剛才打到一半的內容會保留，改完自動放回來。</p>
				<input type="hidden" th:if="${editingId != null}" name="editing" th:value="${editingId}">

				<fieldset class="step-fields" th:disabled="${locked}">
					<label for="name">名稱</label>
					<input id="name" type="text" th:field="*{name}" maxlength="50" placeholder="例如 玉山交割戶">

					<label for="type">類型</label>
					<select id="type" th:field="*{type}">
						<option th:each="t : ${types}" th:value="${t}" th:text="${t.label()}">證券交割戶</option>
					</select>

					<label for="institution">銀行或券商</label>
					<input id="institution" type="text" th:field="*{institution}" maxlength="50" placeholder="例如 玉山證券">

					<div class="two" th:object="${opening}">
						<div>
							<label for="amount">現在的餘額</label>
							<input id="amount" type="text" inputmode="numeric" th:field="*{amount}" placeholder="例如 50000">
						</div>
						<div>
							<label for="date">這是哪一天的餘額</label>
							<input id="date" type="date" th:field="*{date}">
						</div>
					</div>
					<p class="hint muted">填存摺或 App 上現在看到的餘額就好。這天以前的借款和買股票，不會再從這個餘額扣一次。</p>
				</fieldset>

				<div class="form-actions" th:if="${!confirm}">
					<button type="submit" class="btn btn-secondary"
						th:text="${editingId == null} ? '儲存這個帳戶' : '儲存修改'">儲存這個帳戶</button>
					<button th:if="${editingId != null}" type="submit" class="btn btn-link"
						th:formaction="@{/welcome/accounts/cancel-edit}" formnovalidate>取消修改</button>
				</div>
			</form>

			<th:block th:if="${confirm}">
				<section th:replace="~{onboarding/confirm :: confirm(${what}, ${rows}, ${warnings}, ${errors}, ${saveUrl}, ${backUrl}, ${formToken})}"></section>
			</th:block>

			<p class="hint muted" th:if="${!canGoNext}">至少要儲存一個證券交割戶，才能往下走。</p>
			<div class="step-actions">
				<button th:replace="~{onboarding/layout :: leave(${goUrl})}"></button>
				<button th:replace="~{onboarding/layout :: next(${goUrl}, 'loans', '下一步：借款 →', ${!canGoNext})}"></button>
			</div>
		</div>
	</main>
</div>
</body>
</html>
