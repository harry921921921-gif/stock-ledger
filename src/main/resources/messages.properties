typeMismatch.form.endMonth=請選擇結束月份
typeMismatch.form.direction=請選擇收入或支出
typeMismatch.form.amountMode=請選擇金額方式
typeMismatch.form.cycle=請選擇週期
typeMismatch.fillForm.amount=請輸入整數金額
typeMismatch.fillForm.period=請選擇月份
