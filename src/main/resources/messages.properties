# form.fee 是借款的開辦費，也是股票交易的手續費（兩個頁面的 model 名稱都是 form），所以不寫欄位名稱
typeMismatch.form.fee=請輸入整數金額
typeMismatch.form.repaymentMethod=請選擇還款方式
# 股票交易（TradeForm；引導的股票這一步與股票頁共用）：文字和 TradeService 的訊息一致
typeMismatch.form.shares=請輸入股數（正整數）
typeMismatch.form.price=價格請輸入數字
# 擔保股票與維持率門檻（引導的擔保頁 CollateralForm；資金來源頁新增借款的門檻欄位同名，也會用到）
typeMismatch.form.collateral.shares=擔保股數請輸入整數
typeMismatch.form.warnPercent=提醒線請輸入數字
typeMismatch.form.callPercent=追繳線請輸入數字
# 第一次使用引導的帳戶頁：初始現金餘額欄位的 model 名稱是 opening
typeMismatch.opening.amount=請輸入整數金額
typeMismatch.opening.date=請選擇日期
