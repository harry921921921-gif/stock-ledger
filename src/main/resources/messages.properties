typeMismatch.form.startPrincipal=請輸入整數金額
typeMismatch.form.annualRatePercent=年利率請輸入數字
typeMismatch.form.payAccountId=請選擇扣款帳戶
typeMismatch.form.disburseAccountId=請選擇撥入帳戶
typeMismatch.form.payDay=請輸入 1～31 的數字
typeMismatch.form.remainingPeriods=剩餘期數請輸入整數
typeMismatch.form.firstPeriod=請選擇第一期扣款月份
